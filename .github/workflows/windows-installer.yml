name: Windows installer (unsigned)

# Builds the unsigned x64 NSIS installer on a Windows runner, which already
# has Visual Studio Build Tools, Rust and Python. Run it from the Actions tab
# or by pushing to ci/windows-exe; the installer is the job's artifact.
on:
  workflow_dispatch:
  push:
    branches: [ci/windows-exe]

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Add the MSVC Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build the unsigned installer
        shell: bash
        run: vp run dist:desktop:win:x64 --verbose

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
          # The installer is already compressed.
          compression-level: 0
