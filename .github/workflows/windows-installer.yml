name: Windows installer (unsigned)

# Builds the unsigned x64 NSIS installer on a Windows runner, which already
# has Visual Studio Build Tools, Rust and Python. Run it from the Actions tab
# or by pushing to ci/windows-exe; the installer is the job's artifact.
on:
  workflow_dispatch:
  push:
    branches: [ci/windows-exe]

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # persist-credentials: false fails here, so the checkout token is dropped by hand.
      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Add the MSVC Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc

      # The payload validation may reject the package after the installer exists,
      # so keep the stage and report instead of stopping here.
      - name: Build the unsigned installer
        id: build
        continue-on-error: true
        shell: bash
        run: vp run dist:desktop:win:x64 --verbose --keep-stage

      - name: List the packaged payload
        if: always()
        shell: bash
        run: |
          set -u
          for dir in $(find "$RUNNER_TEMP" "$TEMP" -type d -name win-unpacked 2>/dev/null | head -3); do
            echo "== $dir: $(find "$dir" -type f | wc -l) files"
            find "$dir" -type f | sed "s#^$dir/##" | sort | head -250
          done
          ls -la release || true

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
          # The installer is already compressed.
          compression-level: 0

      - name: Fail when the build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "The build step failed; see its log. A partial installer was uploaded above if one exists."
          exit 1
